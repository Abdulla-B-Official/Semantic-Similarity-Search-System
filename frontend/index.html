<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Semantic Similarity Search</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>Semantic Similarity Search</h1>
            <p>Search knowledge-base documents using semantic meaning.</p>
        </div>
    </header>


    <main class="container">

        <section class="search-section">

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Enter your search query..."
                    autocomplete="off"
                >

                <button id="searchButton">
                    Search
                </button>
            </div>

            <p id="statusMessage" class="status-message"></p>

        </section>


        <section id="resultsSection" class="results-section">

            <div class="results-header">
                <h2>Search Results</h2>
                <span id="resultCount"></span>
            </div>

            <div id="resultsContainer">
                <div class="empty-state">
                    Enter a query to find similar documents.
                </div>
            </div>

        </section>

    </main>


    <footer class="footer">
        <p>Semantic Similarity Search System</p>
    </footer>


    <script src="/js/script.js"></script>

</body>
</html>
